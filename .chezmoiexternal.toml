[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/laravel-sail"]
type = "git-repo"
url = "https://github.com/ariaieboy/laravel-sail.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

# Tracks master: v1.20.0 is the newest tag but master carries the active work.
# Config template changes upstream mean ~/.p10k.zsh needs `p10k configure` again.
[".oh-my-zsh/custom/themes/powerlevel10k"]
type = "git-repo"
url = "https://github.com/romkatv/powerlevel10k.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

[".config/tmux/tmux.conf"]
type = "file"
url = "https://raw.githubusercontent.com/gpakosz/.tmux/master/.tmux.conf"
refreshPeriod = "168h"
