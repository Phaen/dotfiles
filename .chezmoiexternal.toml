[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/laravel-sail"]
type = "git-repo"
url = "https://github.com/ariaieboy/laravel-sail.git"
refreshPeriod = "168h"
clone.args = ["--depth=1"]
pull.args = ["--ff-only"]

# Pinned: ~/.p10k.zsh is wizard-generated against this tag, so bumping it means
# re-running `p10k configure`. Tag clones are detached, hence no pull args.
[".oh-my-zsh/custom/themes/powerlevel10k"]
type = "git-repo"
url = "https://github.com/romkatv/powerlevel10k.git"
refreshPeriod = "8760h"
clone.args = ["--branch=v1.20.0", "--depth=1"]

[".config/tmux/tmux.conf"]
type = "file"
url = "https://raw.githubusercontent.com/gpakosz/.tmux/master/.tmux.conf"
refreshPeriod = "168h"
